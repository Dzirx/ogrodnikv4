# Porty przesuniete wzgledem pierwszej wersji (~/projekt/ogrodnikv3), zeby oba
# projekty mogly stac obok siebie - stary zostaje do porownania.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ogrodnik
      POSTGRES_PASSWORD: ogrodnik
      POSTGRES_DB: ogrodnik
    ports: ["127.0.0.1:5433:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ogrodnik"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports: ["127.0.0.1:6335:6333"]
    volumes: [qdrant-data:/qdrant/storage]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:6380:6379"]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ogrodnik
      MINIO_ROOT_PASSWORD: ogrodnik12345
    ports: ["127.0.0.1:9002:9000", "127.0.0.1:9003:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
      qdrant: {condition: service_started}
    ports: ["127.0.0.1:8002:8000"]
    volumes: [.:/srv/app]

  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
      redis: {condition: service_started}
    volumes: [.:/srv/app]

volumes:
  postgres-data:
  qdrant-data:
  minio-data:
